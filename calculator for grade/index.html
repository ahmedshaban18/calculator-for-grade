<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>calculator fo grade</title>
</head>
<body>
    <form id="form" class="container">
        <h2>calculator for grade</h2>
        <div class="two-subject">
        <div class="input-student">
            <h5>enter your mark</h5>
            <input type="number" placeholder="arabic" id="arabic">
        </div>
        <div class="input-student">
            <h5>enter your mark</h5>
          
            <input type="number" placeholder="english" id="english">
        </div>
        </div>
        <div class="two-subject">
        <div class="input-student">
            <h5>enter your mark</h5>
           
            <input type="number" placeholder="math" id="math">
        </div>
        <div class="input-student">
            <h5>enter your mark</h5>
           
            <input type="number" placeholder="science" id="science">
        </div>
        </div>
        <div class="two-subject">
        <div class="input-student">
            <h5>enter your mark</h5>
           
            <input type="number" placeholder="history" id="history">
        </div>
        <div class="input-student">
            <h5>enter your mark</h5>
           
            <input type="number" placeholder="ict" id="ict">
        </div>
        </div>
        <button class="chek" type="submit">chek</button>
    </form>
    <div class="container-score">
        <h2>Arabic:<div id="arabic-output"></div></h2>
        <h2>english:<div id="english-output"></div></h2>
        <h2>math:<div id="math-output"></div></h2>
        <h2>science:<div id="science-output"></div></h2>
        <h2>ict:<div id="ict-output"></div></h2>
        <h2>history:<div id="history-output"></div></h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
